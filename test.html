<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Word Finder</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f5f4f0;
            color: #1a1a18;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .app {
            width: 100%;
            max-width: 720px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #888780;
            margin-bottom: 1.5rem;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 1.25rem;
        }

        .phone-input {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            letter-spacing: 0.1em;
            padding: 0 16px;
            height: 54px;
            border: 1px solid #d3d1c7;
            border-radius: 10px;
            background: #fff;
            color: #1a1a18;
            outline: none;
            transition: border-color 0.15s;
        }

        .phone-input:focus {
            border-color: #378add;
            box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12);
        }

        .find-btn {
            height: 54px;
            padding: 0 24px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            border: 1px solid #d3d1c7;
            background: #1a1a18;
            color: #f5f4f0;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }

        .find-btn:hover {
            background: #333;
        }

        .find-btn:active {
            transform: scale(0.98);
        }

        .find-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.8125rem;
            color: #888780;
            margin-bottom: 1rem;
            min-height: 18px;
        }

        .resultContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }

        .result-card {
            background: #fff;
            border: 1px solid var(--border-muted);
            border-radius: 10px;
            padding: 10px 14px;
            transition: border-color 0.15s;
        }

        .result-card:hover {
            border-color: #b4b2a9;
        }

        .result-display {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #1a1a18;
            line-height: 1.2;
        }

        .result-display .word-part {
            color: #185fa5;
        }

        .result-word {
            font-size: 0.7rem;
            color: #888780;
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        .result-sentiment {
            font-size: 0.6875rem;
            margin-top: 4px;
            padding: 2px 7px;
            border-radius: 999px;
            display: inline-block;
        }

        .sent-pos {
            background: #eaf3de;
            color: #3b6d11;
        }

        .sent-neg {
            background: #fcebeb;
            color: #a32d2d;
        }

        .sent-neu {
            background: #f1efe8;
            color: #5f5e5a;
        }

        .empty {
            font-size: 0.875rem;
            color: #888780;
            padding: 2.5rem 0;
            text-align: center;
        }

        .note {
            font-size: 0.75rem;
            color: #b4b2a9;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #d3d1c7;
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Phone Word Finder</h1>
        <p class="subtitle">Enter a phone number to discover words hidden in its digits.</p>
        <div class="input-row">
            <input class="phone-input" type="tel" id="phoneInput" placeholder="800-555-1234" maxlength="20" />
            <button class="find-btn" id="findBtn" onclick="findWords()">Find words</button>
        </div>
        <!-- <div class="status" id="status"></div> -->
        <div class="resultContainer" id="resultsContainer"></div>
        <p class="note">Words shown in blue form a real word; surrounding characters stay as digits.</p>
    </div>

    <script>
        const KEY_MAP = {
            '0': [' '], '1': [' '],
            '2': ['a', 'b', 'c'], '3': ['d', 'e', 'f'],
            '4': ['g', 'h', 'i'], '5': ['j', 'k', 'l'],
            '6': ['m', 'n', 'o'], '7': ['p', 'q', 'r', 's'],
            '8': ['t', 'u', 'v'], '9': ['w', 'x', 'y', 'z']
        };


        const wordMap = {};

        async function loadWords() {
            const btn = document.getElementById('findBtn');
            btn.disabled = true;
            btn.textContent = 'Loading…';
            try {
                const resp = await fetch('SentimentValues.txt');
                if (!resp.ok) throw new Error('File not found');
                const text = await resp.text();
                for (const line of text.split('\n')) {
                    const comma = line.lastIndexOf(',');
                    if (comma < 0) continue;
                    const word = line.substring(0, comma).trim().toLowerCase();
                    const val = parseFloat(line.substring(comma + 1));
                    if (word.length >= 2 && word.length <= 10 && /^[a-z]+$/.test(word) && !isNaN(val)) {
                        wordMap[word] = val;
                    }
                }
                document.getElementById('status').textContent = 'Loaded ' + Object.keys(wordMap).length.toLocaleString() + ' words.';
                setTimeout(() => { document.getElementById('status').textContent = ''; }, 2000);
            } catch (e) {
                document.getElementById('status').textContent = 'Error: could not load SentimentValues.txt — make sure it is in the same folder.';
            }
            btn.disabled = false;
            btn.textContent = 'Find words';
        }

        loadWords();

        function containsWord(combo) {
            for (const w in wordMap) { if (combo.includes(w)) return true; }
            return false;
        }

        function buriedWord(combo) {
            let longest = '';
            for (const w in wordMap) {
                if (combo.includes(w) && w.length > longest.length) longest = w;
            }
            return longest;
        }

        function getOptions(digits) {
            let options = [''];
            for (const d of digits) {
                const letters = KEY_MAP[d] || [' '];
                const next = [];
                for (const opt of options) for (const ch of letters) next.push(opt + ch);
                options = next;
                if (options.length > 500000) break;
            }
            return options;
        }

        function buildResults(digits, rawOptions) {
            const filtered = rawOptions.filter(o => containsWord(o));
            const results = [], seen = new Set();
            for (const opt of filtered) {
                const word = buriedWord(opt);
                const start = opt.indexOf(word), end = start + word.length;
                let display = '';
                for (let i = 0; i < opt.length; i++) display += (i >= start && i < end) ? opt[i] : digits[i];
                if (!seen.has(display)) { seen.add(display); results.push({ display, word, sentiment: wordMap[word] || 0 }); }
            }
            return results;
        }

        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            if (!results.length) { container.innerHTML = '<div class="empty">No phone words found for this number.</div>'; return; }
            const grid = document.createElement('div');
            grid.className = 'results-grid';
            for (const r of results) {
                const card = document.createElement('div');
                card.className = 'result-card';
                const displayHTML = r.display.split('').map(ch => /[a-z]/i.test(ch) ? '<span class="word-part">' + ch.toUpperCase() + '</span>' : ch).join('');
                let sentClass = r.sentiment > 0.3 ? 'sent-pos' : r.sentiment < -0.3 ? 'sent-neg' : 'sent-neu';
                const sentLabel = (r.sentiment >= 0 ? '+' : '') + r.sentiment.toFixed(2);
                card.innerHTML = '<div class="result-display">' + displayHTML + '</div><div class="result-word">' + r.word + '</div><span class="result-sentiment ' + sentClass + '">' + sentLabel + '</span>';
                grid.appendChild(card);
            }
            container.innerHTML = '';
            container.appendChild(grid);
        }

        async function findWords() {
            const raw = document.getElementById('phoneInput').value;
            const digits = raw.replace(/\D/g, '').split('');
            if (!digits.length) { document.getElementById('status').textContent = 'Enter a phone number first.'; return; }
            document.getElementById('status').textContent = 'Generating combinations…';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('findBtn').disabled = true;
            await new Promise(r => setTimeout(r, 10));
            const options = getOptions(digits);
            document.getElementById('status').textContent = 'Checking ' + options.length.toLocaleString() + ' combinations…';
            await new Promise(r => setTimeout(r, 10));
            const results = buildResults(digits, options);
            document.getElementById('status').textContent = results.length
                ? 'Found ' + results.length + ' phone word' + (results.length !== 1 ? 's' : '') + ' — letters in blue form a real word.'
                : 'Checked ' + options.length.toLocaleString() + ' combinations — no words found.';
            renderResults(results);
            document.getElementById('findBtn').disabled = false;
        }

        document.getElementById('phoneInput').addEventListener('keydown', e => { if (e.key === 'Enter') findWords(); });
    </script>
</body>

</html>
